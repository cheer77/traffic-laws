name: traffic-laws-api
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: traffic_laws
      POSTGRES_USER: traffic_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_owner -d traffic_laws"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
