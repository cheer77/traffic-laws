packages:
  - "apps/*"
  - "packages/*"

# Only these dependencies may execute native installation scripts.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Swagger 11 pins an affected YAML parser; same-major security fix.
overrides:
  "@nestjs/swagger>js-yaml": "5.4.1"
  # Only this reviewed consumer uses globSync + onlyDirectories. See docs/dependency-security.md.
  "@next/eslint-plugin-next@16.4.1>fast-glob": "npm:tinyglobby@0.2.17"
  # Keep the existing stable Vite 7 transform while adopting patched Vitest.
  "vitest>vite": "7.3.7"
patchedDependencies:
  "@next/eslint-plugin-next@16.4.1": patches/@next__eslint-plugin-next@16.4.1.patch
